<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UWR Personnel Register</title>
<meta name="description" content="Personnel register of the Ghana National Fire Service, Upper West Regional Command.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#C42A1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UWR Register">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F5F6F8; --ink:#141B24; --muted:#5A6573; --line:#D8DCE2;
  --accent:#C42A1E; --accent-ink:#FFFFFF; --accent-soft:#FBE8E5; --gold:#A87A12;
  --ok:#1E7A4C; --ok-soft:#E0F1E7; --warn:#9A5A00; --warn-soft:#FBEED7; --bad:#B42318; --bad-soft:#FCE5E2;
  --info:#2459A8; --info-soft:#E3ECF9; --neutral-soft:#E9EBEF;
  --shadow:0 1px 2px rgba(20,27,36,.06),0 8px 24px rgba(20,27,36,.08);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1318; --surface:#161C23; --surface-2:#1C242D; --ink:#E6EAEF; --muted:#95A1AF; --line:#2A333E;
    --accent:#EF5A4C; --accent-ink:#1B0705; --accent-soft:#3A1A17; --gold:#D9A93B;
    --ok:#52C68D; --ok-soft:#15301F; --warn:#F0A94A; --warn-soft:#352711; --bad:#F2766A; --bad-soft:#3A1916;
    --info:#7FAAF0; --info-soft:#17263B; --neutral-soft:#232C36;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1318; --surface:#161C23; --surface-2:#1C242D; --ink:#E6EAEF; --muted:#95A1AF; --line:#2A333E;
  --accent:#EF5A4C; --accent-ink:#1B0705; --accent-soft:#3A1A17; --gold:#D9A93B;
  --ok:#52C68D; --ok-soft:#15301F; --warn:#F0A94A; --warn-soft:#352711; --bad:#F2766A; --bad-soft:#3A1916;
  --info:#7FAAF0; --info-soft:#17263B; --neutral-soft:#232C36;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
.mono{font-family:var(--mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top,0px)) 14px 20px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.mark{width:40px;height:40px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 13px/1 var(--display);letter-spacing:.02em;flex:none}
.brand b{display:block;font:600 17px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:19px;height:19px;flex:none}
.nav .count{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.dot.off{background:var(--warn)}

.main{min-width:0;padding-inline:28px;padding-block:calc(24px + env(safe-area-inset-top,0px)) 48px;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.topbar h1{font-size:34px;text-transform:uppercase;letter-spacing:.02em}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;cursor:pointer;display:inline-flex;gap:7px;align-items:center;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.info{background:var(--info-soft);border-color:transparent}
.banner p{margin:0;flex:1 1 260px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h2{font-size:19px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font:500 12px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .value{font:600 40px/1.05 var(--display);font-variant-numeric:tabular-nums}
.kpi .sub{font-size:13px;color:var(--muted)}
.kpi.accent .value{color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2 > *{min-width:0}

/* bars */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 36px;gap:10px;align-items:center;font-size:13.5px}
.bar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar.rank .fill{background:var(--gold)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.bloods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.blood{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline}
.blood b{font:600 18px var(--display)}
.blood span{font-variant-numeric:tabular-nums;font-weight:600}

.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.alerts li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.alerts li:first-child{border-top:0}
.alerts .grow{flex:1;min-width:0}
.linkish{all:unset;cursor:pointer;font-weight:600}
.linkish:hover{text-decoration:underline}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--neutral-soft);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.rank{font-family:var(--display);font-weight:600;letter-spacing:.03em;font-size:15px;color:var(--gold);white-space:nowrap}

/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
select.f{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px;max-width:100%}
.resultline{font-size:13px;color:var(--muted)}

/* table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who b{font-weight:600}
.av{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font:600 13px var(--display);letter-spacing:.04em;color:var(--muted);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:84px;height:84px;font-size:28px;border-radius:14px}

.cards{display:none;flex-direction:column;gap:8px}
.pcard{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.pcard .av{grid-row:span 2}
.pcard .l1{display:flex;gap:8px;align-items:baseline;min-width:0}
.pcard .l1 b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .l2{font-size:13px;color:var(--muted);grid-column:2 / 4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end}
.sheet .back{position:absolute;inset:0;background:rgba(10,14,20,.45)}
.sheet .pane{position:relative;background:var(--bg);width:min(640px,100%);height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.pane-head{display:flex;align-items:center;gap:10px;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.pane-head h2{font-size:20px;text-transform:uppercase;letter-spacing:.04em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pane-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.pane-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.pane-foot .spacer{flex:1}

.hero{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero .n1{font:600 26px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dl dd{margin:2px 0 0;overflow-wrap:anywhere}
.dl .wide{grid-column:1 / -1}
.meter{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ok)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.hist li:first-child{border-top:0}

/* forms */
fieldset{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px 16px;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
legend{font:600 15px var(--display);text-transform:uppercase;letter-spacing:.06em;padding:0 6px;color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1 / -1}
.fld label{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld label .req{color:var(--accent)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px 10px;min-height:40px;font-size:16px}
.fld textarea{min-height:72px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.fld .hint{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:13.5px;font-weight:500}
.photo-row{display:flex;gap:14px;align-items:center;grid-column:1 / -1}

/* lists (leave/transfer) */
.rowlist{display:flex;flex-direction:column;gap:8px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.rec .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.rec .sub{font-size:13.5px;color:var(--muted);grid-column:1 / -1;display:flex;gap:6px 14px;flex-wrap:wrap}
.rec .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.route{font-weight:600}
.route i{font-style:normal;color:var(--accent);padding:0 4px}

.segs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.segs button{all:unset;cursor:pointer;padding:5px 11px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--muted)}
.segs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:861px){.toast{bottom:28px}}

.tabbar{display:none}
.settings-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.settings-grid textarea{width:100%;min-height:260px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:10px;font:14px/1.6 var(--mono)}

.gate{min-height:100vh;display:grid;place-items:center;padding-inline:16px;padding-block:32px;background:var(--bg)}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.gate-top{background:var(--accent);color:var(--accent-ink);padding:22px 24px;display:flex;gap:14px;align-items:center}
.gate-top .mark{background:var(--accent-ink);color:var(--accent)}
.gate-top b{font:600 22px/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em;display:block}
.gate-top small{opacity:.9;font-size:12.5px}
.gate-body{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.gate-body h2{font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.gate-body p{margin:0}
.gate-body .btn.primary{justify-content:center;min-height:44px}
.gate-foot{padding:0 24px 20px;font-size:12.5px;color:var(--muted)}
.me{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.me b{display:block;font-size:13.5px;line-height:1.25;color:var(--ink)}
.me small{color:var(--muted);font-size:12px;display:block}
.me-actions{display:flex;gap:6px;flex-wrap:wrap}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;grid-column:1 / -1}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:400}
.checks input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
.roles{display:grid;gap:8px;grid-column:1 / -1}
.rolepick{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--surface-2)}
.rolepick:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.rolepick input{margin-top:3px;accent-color:var(--accent)}
.rolepick b{display:block;font-size:14px}.rolepick small{color:var(--muted);font-size:12.5px}
.scope-note{font-size:13px;color:var(--muted)}
.atts{display:flex;flex-wrap:wrap;gap:8px}
.att{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 8px;max-width:100%;color:var(--ink);text-decoration:none;font-size:13.5px}
a.att:hover{border-color:var(--accent)}
.att img{width:40px;height:40px;object-fit:cover;border-radius:5px;flex:none}
.attic{width:40px;height:40px;border-radius:5px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 12px var(--display);letter-spacing:.05em;flex:none}
.attn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.att .btn.ghost{padding:2px;min-height:24px}
.att .btn svg{width:15px;height:15px}
.casebtn{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;appearance:none}
.casebtn:hover{border-color:var(--muted)}
.casebtn.unread{border-left:3px solid var(--accent)}
.udot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;flex:none;align-self:center}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-24px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.memobody{white-space:pre-wrap;line-height:1.65;margin:16px 0;max-width:68ch;font-size:15.5px}
.tbn{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;line-height:16px;text-align:center;font-weight:700}
.morenav button{font-size:16px;padding:12px 10px}
.pickhint:empty{display:none}
.hero .chip,.rec .chip{white-space:normal}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.settings-grid{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .tabbar[hidden]{display:none!important}
  .side{display:none}
  .main{padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(92px + env(safe-area-inset-bottom,0px))}
  .topbar h1{font-size:28px}
  .grid2{grid-template-columns:1fr}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}

async function setupAdmin(e){
  e.preventDefault();const err=$("#suErr");const n=$("#su_name").value.trim(),u=uname($("#su_user").value),p=$("#su_pw").value,p2=$("#su_pw2").value;

async function afterAuth(){

  if(prof.data.active===false){await sb.auth.signOut();S.gateMsg="This account has been disabled. Contact the administrator.";showGate();return false;}
  S.me={...prof.data,id:prof.id,username:prof.username};
  $("#gate").innerHTML=gateShell(`<p class="muted">Loading the register…</p>`);

async function doLogin(e){
  e.preventDefault();const err=$("#liErr");const fail=m=>{err.textContent=m;err.hidden=false;};
  if(Date.now()<S.lockUntil)return fail(`Too many failed attempts. Try again in ${Math.ceil((S.lockUntil-Date.now())/1000)} seconds.`);
  const u=uname($("#li_user").value),p=$("#li_pw").value;
  if(!u||!p)return fail("Enter your username (or service number) and password.");
  const btn=e.target.querySelector("button");btn.disabled=true;
  const r=await sb.auth.signInWithPassword({email:emailOf(u),password:p});
  btn.disabled=false;
  if(r.error){S.fails++;if(S.fails>=5){S.lockUntil=Date.now()+60000;S.fails=0;}$("#li_pw").value="";return fail(/fetch|network/i.test(r.error.message)?"No connection. Check your internet and try again.":"Username or password is incorrect.");}
  S.fails=0;try{localStorage.setItem("uwr.loginAt",String(Date.now()));}catch(x){}
  if(await afterAuth())logAct("Signed in","");
}
async function activate(e){
  e.preventDefault();const err=$("#acErr");const fail=m=>{err.textContent=m;err.hidden=false;};
  if(Date.now()<S.lockUntil)return fail(`Too many failed attempts. Try again in ${Math.ceil((S.lockUntil-Date.now())/1000)} seconds.`);
  const snRaw=$("#ac_sn").value.trim(),dob=$("#ac_dob").value,ph=$("#ac_ph").value,pw=$("#ac_pw").value,pw2=$("#ac_pw2").value;
  if(!snRaw||!dob||ph.replace(/\D/g,"").length<9)return fail("Fill in your service number, date of birth and full phone number.");
  const pp=pwProblem(pw);if(pp)return fail(pp);if(pw!==pw2)return fail("The two passwords do not match.");
  const btn=e.target.querySelector("button");btn.disabled=true;const done=m=>{btn.disabled=false;fail(m);};
  const v=(await sb.rpc("verify_personnel",{p_sn:snRaw,p_dob:dob,p_phone:ph})).data;
  if(v==="nomatch"){S.fails++;if(S.fails>=5){S.lockUntil=Date.now()+120000;S.fails=0;}return done("Those details do not match a personnel record. Check them, or ask HR to update your record.");}
  if(v==="inactive")return done("Your record is not active. Contact HR.");
  if(v==="exists")return done("An account already exists for this service number. Sign in with your service number, or ask the administrator to reset your password.");
  if(v!=="ok")return done("Could not check your details. Check your connection and try again.");
  const u=uname(snRaw);
  let r=await sb.auth.signUp({email:emailOf(u),password:pw});
  if(r.error&&/registered|exists/i.test(r.error.message))r=await sb.auth.signInWithPassword({email:emailOf(u),password:pw});
  if(r.error)return done(/registered|exists|invalid/i.test(r.error.message)?"This service number already has a login with a different password. Ask the administrator to reset it.":"Could not create the account: "+r.error.message);
  if(!r.data.session)return done("Account setup is not switched on yet. Ask the administrator to turn off email confirmation in Supabase.");
  const c=await sb.rpc("claim_personnel",{p_sn:snRaw,p_dob:dob,p_phone:ph,p_username:u});
  if(c.error){await sb.auth.signOut();return done("Could not finish setting up your account. Try again or contact HR.");}
  S.fails=0;S.gateMode="login";try{localStorage.setItem("uwr.loginAt",String(Date.now()));}catch(x){}
  if(await afterAuth()){logAct("Activated personnel account",snRaw);toast("Account created. Next time, sign in with your service number.");}
}

function count(arr,key,order){
  const m=new Map();arr.forEach(p=>{const k=p[key]||"Not set";m.set(k,(m.get(k)||0)+1);});
  return [...m.entries()].sort((a,b)=>{const ia=order.indexOf(a[0]),ib=order.indexOf(b[0]);return (ia<0?999:ia)-(ib<0?999:ib)||b[1]-a[1];});
}
function bars(rows,cls){
  if(!rows.length)return `<p class="empty">No personnel recorded yet.</p>`;
  const max=Math.max(...rows.map(r=>r[1]));

}

function filtered(){
  const f=S.f,q=f.q.replace(/[()]/g," ").trim().toLowerCase();
  let r=people().filter(p=>{
    const st=p.status||"Active";
    if(f.status==="inStrength"&&!IN_STRENGTH.has(st))return false;
    if(f.status&&f.status!=="inStrength"&&st!==f.status)return false;
    if(f.station&&p.station!==f.station)return false;
    if(f.rank&&p.rank!==f.rank)return false;
    if(f.gender&&p.gender!==f.gender)return false;
    if(q){const hay=[p.serviceNo,p.surname,p.firstName,p.otherNames,p.phone,p.altPhone,p.unit,p.appointment,p.ghanaCard].join(" ").toLowerCase();if(!q.split(/\s+/).every(w=>hay.includes(w)))return false;}
    return true;});
  const nm=(a,b)=>(a.surname||"").localeCompare(b.surname||"")||(a.firstName||"").localeCompare(b.firstName||"");
  const s={rank:(a,b)=>rankIdx(a.rank)-rankIdx(b.rank)||(a.lastPromotion||"9").localeCompare(b.lastPromotion||"9")||nm(a,b),
    name:nm,station:(a,b)=>(a.station||"").localeCompare(b.station||"")||rankIdx(a.rank)-rankIdx(b.rank),

}

function field([k,l,type,o],val){

  else if(type.startsWith("list:")){const key=type.slice(5);ctl=`<input id="${id}" name="${k}" list="dl_${key}" value="${esc(val)}"><datalist id="dl_${key}">${(S.lists[key]||[]).map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`;}
  else if(type==="textarea")ctl=`<textarea id="${id}" name="${k}">${esc(val)}</textarea>`;

async function savePerson(id){
  const form=$("#pform"),data={};
  PFORM.forEach(s=>s.f.forEach(([k])=>{const el=form.elements[k];if(el)data[k]=el.value.trim();}));
  const err=$("#perr");const fail=m=>{err.textContent=m;err.hidden=false;};
  const miss=["serviceNo","rank","surname","firstName"].filter(k=>!data[k]);
  if(miss.length)return fail("Fill in the service number, rank, surname and first name before saving.");
  if(S.me.role==="district"&&!(S.me.stations||[]).includes(data.station))return fail("Choose one of your stations.");
  const dup=S.personnel.find(x=>x.id!==id&&(x.serviceNo||"").toLowerCase()===data.serviceNo.toLowerCase());
  if(dup)return fail(`Service number ${data.serviceNo} is already on the register${scopeOK(dup)?" for "+dup.rank+" "+shortName(dup):""}.`);
  const prev=id?byId(id):null;
  const rec={...(prev||{}),...data,photoId:S.formPhoto||"",createdAt:prev?.createdAt||new Date().toISOString()};
  const nid=id||(sid(data.serviceNo)&&!byId(sid(data.serviceNo))?sid(data.serviceNo):newId());
  try{const r=await commit(id?"Edited personnel record":"Added personnel record",pLabel(rec),[{col:"personnel",id:nid,data:rec,before:prev}]);
    if(r==="pending"){toast(PENDING_MSG);if(id)openProfile(id);else closeSheet(true);}else{toast("Record saved");openProfile(nid);}}catch(e){writeFail(e);}
}

const personKey=p=>`${p.rank?p.rank+" ":""}${(p.surname||"").toUpperCase()} ${p.firstName||""}${p.otherNames?" "+p.otherNames:""} (${p.serviceNo||"no service no."})`.replace(/\s+/g," ").trim();
function resolvePerson(txt,list){
  txt=(txt||"").trim();if(!txt)return null;list=list||people();
  const m=/\(([^()]+)\)\s*$/.exec(txt);
  if(m){const sn=m[1].trim().toLowerCase();const hit=list.find(p=>(p.serviceNo||"").toLowerCase()===sn);if(hit)return hit;}
  const t=txt.toLowerCase();
  const exact=list.filter(p=>(p.serviceNo||"").toLowerCase()===t||personKey(p).toLowerCase()===t);if(exact.length===1)return exact[0];
  const words=t.replace(/[()]/g," ").split(/\s+/).filter(Boolean);
  const hits=list.filter(p=>{const h=personKey(p).toLowerCase();return words.every(w=>h.includes(w));});
  return hits.length===1?hits[0]:null;
}

async function createAuthUser(username,pw){

const MAX_FILE=15*1024*1024;
const canUpload=()=>!!(S.me&&S.me.role!=="viewer");
async function uploadOne(f){
  const safe=(f.name||"file").replace(/[^\w.\-]+/g,"_").slice(-80);
  const path=`${new Date().getFullYear()}/${newId()}-${safe}`;
  chk(await sb.storage.from("files").upload(path,f,{contentType:f.type||undefined,upsert:false}));

S.urls={};
async function hydrate(){
  if(!sb||!S.me)return;
  const els=[...document.querySelectorAll("[data-path]:not([data-ok])")];if(!els.length)return;
  const need=[...new Set(els.map(e=>e.dataset.path))].filter(p=>!S.urls[p]||S.urls[p].exp<Date.now());
  if(need.length){try{const d=chk(await sb.storage.from("files").createSignedUrls(need,3600));(d||[]).forEach(x=>{if(x.signedUrl)S.urls[x.path]={u:x.signedUrl,exp:Date.now()+3300e3};});}catch(e){}}
  els.forEach(e=>{const u=S.urls[e.dataset.path];if(!u)return;e.dataset.ok="1";if(e.tagName==="IMG")e.src=u.u;else e.href=u.u;});
}

async function uploadFiles(key,files){

const caseType=k=>CASE_TYPES.find(x=>x[0]===k)||CASE_TYPES[CASE_TYPES.length-1];
function tgt(s){if(!s)return null;if(typeof s==="object")return s;if(s==="hr")return {kind:"hr"};if(s==="admin")return {kind:"admin"};const i=s.indexOf(":");const k=s.slice(0,i),v=s.slice(i+1);

const tgtKey=a=>!a?"":a.kind==="unit"?"unit:"+a.unit:a.kind==="district"?"district:"+a.station:a.kind==="user"?"user:"+a.id:a.kind;
function tgtLabel(a){if(!a)return "—";if(a.kind==="hr")return "HR Officer";if(a.kind==="admin")return "Regional administrator";if(a.kind==="district")return "District Fire Commander, "+a.station;if(a.kind==="unit")return "Head of "+a.unit;if(a.kind==="user"){const u=S.users.find(x=>x.id===a.id);return u?u.name:a.id;}return "—";}
function matches(u,a){
  if(!u||!a||u.active===false)return false;
  if(a.kind==="hr")return u.role==="hr";if(a.kind==="admin")return u.role==="admin";
  if(a.kind==="district")return u.role==="district"&&(u.stations||[]).includes(a.station);
  if(a.kind==="unit")return u.role==="dept"&&(u.units||[]).includes(a.unit);
  if(a.kind==="user")return u.id===a.id;return false;
}
const isMine=a=>matches(S.me,a);
const hasHolder=a=>S.users.some(u=>matches(u,a));
function bossFor(p){
  if(!p)return hrOrAdmin();
  const d={kind:"district",station:p.station};if(p.station&&hasHolder(d))return d;
  const u={kind:"unit",unit:p.unit};if(p.unit&&hasHolder(u))return u;

function handlerFor(type){let a=tgt(caseType(type)[2]);if(a.kind==="unit"&&!hasHolder(a))a=hrOrAdmin();if(a.kind==="hr"&&!hasHolder(a))a={kind:"admin"};return a;}

function personOf(u){return u&&u.personnelId?byId(u.personnelId):null;}
function memberOf(u,k){
  if(!u)return false;if(k==="all")return true;
  const i=k.indexOf(":");const kind=k.slice(0,i),v=k.slice(i+1);const p=personOf(u);
  if(kind==="role")return u.role===v;
  if(kind==="user")return u.id===v;
  if(kind==="station")return (u.role==="district"&&(u.stations||[]).includes(v))||(p&&p.station===v);
  if(kind==="unit")return (u.role==="dept"&&(u.units||[]).includes(v))||(p&&p.unit===v);
  return false;
}
function recipLabel(k){if(k==="all")return "All staff and personnel";const i=k.indexOf(":");const kind=k.slice(0,i),v=k.slice(i+1);
  if(kind==="role")return v==="district"?"All district fire commanders":v==="dept"?"All department / unit heads":v==="admin"?"Regional administrator":v==="hr"?"HR":(ROLES[v]?.label||v);
  if(kind==="station")return "Everyone at "+v;if(kind==="unit")return "Everyone in "+v;if(kind==="user"){const u=S.users.find(x=>x.id===v);return u?u.name:v;}return k;}

const unreadMemos=()=>S.memos.filter(m=>m.from!==S.me.id&&(m.to||[]).some(k=>memberOf(S.me,k))&&!((S.reads[S.me.id]||{})[m.id]));
function memoGroups(){
  const r=S.me.role,p=personOf(S.me);const g=[];
  if(r==="admin"||r==="hr"){g.push("all","role:district","role:dept","role:hr","role:admin");S.lists.stations.forEach(s=>g.push("station:"+s));S.lists.units.forEach(u=>g.push("unit:"+u));}
  else{g.push("role:admin","role:hr","role:district");
    if(r==="district"){(S.me.stations||[]).forEach(s=>g.push("station:"+s));g.push("role:dept");}
    if(r==="dept")(S.me.units||[]).forEach(u=>g.push("unit:"+u));
    if(p&&r==="personnel"){/* officers write to their leaders, not whole groups */}
  }
  return [...new Set(g)];
}

const FIELD_LABEL=(()=>{const m={};PFORM.forEach(s=>s.f.forEach(([k,l])=>m[k]=l));Object.assign(m,{personnelId:"Officer",type:"Type",start:"Start date",end:"End date",relief:"Relieving officer",ref:"Reference",remarks:"Remarks",from:"From",to:"To",dateIssued:"Date of posting order",effectiveDate:"Effective date",name:"Name",role:"Role",stations:"Stations",units:"Units",active:"Account status",ranks:"Ranks",documents:"Documents"});m.status="Status";m.units="Units";return m;})();
const DATE_KEYS=/^(dob|dateEnlisted|lastPromotion|start|end|effectiveDate|dateIssued)$/;
const SKIP_KEYS=new Set(["personnelId_user","selfActivated","updatedAt","updatedBy","createdAt","salt","example","requestedBy","decidedBy","manager","lastLogin","mustChange","hash","photoId","id"]);
function fmtVal(k,v){
  if(v==null||v===""||(Array.isArray(v)&&!v.length))return '<span class="muted">—</span>';
  if(Array.isArray(v))return esc(v.map(x=>x&&typeof x==="object"?(x.cat?x.cat+": ":"")+(x.name||""):x).join(", "));
  if(k==="role")return esc(ROLES[v]?.label||v);
  if(k==="personnelId")return esc(pLabel(byId(v)));
  if(k==="active")return v===false?"Disabled":"Active";
  if(DATE_KEYS.test(k))return fmtD(v);
  return esc(String(v)).replace(/\n/g,"<br>");
}
function opName(o){
  const d=o.data||o.before||{};
  if(o.col==="personnel")return pLabel(d);
  if(o.col==="leave")return (d.type||"")+" leave for "+pLabel(byId(d.personnelId));
  if(o.col==="transfers")return "transfer of "+pLabel(byId(d.personnelId));
  if(o.col==="profiles")return "login "+(d.name||"")+" ("+(o.username||"")+")";
  if(o.col==="password"){const u=S.users.find(x=>x.id===o.id);return "password for "+(u?u.name:o.username||"");}
  if(o.col==="settings")return "drop-down lists";
  return o.col+" "+o.id;
}
function currentDoc(o){if(o.col==="settings")return S.lists;if(o.col==="profiles"||o.col==="password")return S.users.find(x=>x.id===o.id);return (S[o.col]||[]).find(x=>x.id===o.id);}
function opDiff(o){
  if(o.col==="password")return `<div><span class="chip info">Reset password</span> ${esc(opName(o))} <span class="muted">(to a temporary password the user must change)</span></div>`;
  const verb=o.data==null?"Delete":o.before?"Change":"Create";
  const cur=currentDoc(o);let warn="";
  if(o.before&&!cur&&o.col!=="settings")warn="This record no longer exists.";
  else if(o.before&&cur&&o.col!=="settings"&&o.col!=="profiles"&&cur.updatedAt&&o.before.updatedAt&&cur.updatedAt!==o.before.updatedAt)warn="This record has changed since the request was made. Approving replaces it with the version below.";
  else if(!o.before&&o.data&&cur)warn="A record with this ID already exists. Approving overwrites it.";
  let rows="";
  if(o.data){
    const keys=[...new Set([...Object.keys(o.before||{}),...Object.keys(o.data)])].filter(k=>!SKIP_KEYS.has(k));
    rows=keys.filter(k=>JSON.stringify((o.before||{})[k]??"")!==JSON.stringify(o.data[k]??"")).map(k=>`<tr><td>${esc(FIELD_LABEL[k]||k)}</td>${o.before?`<td>${fmtVal(k,o.before[k])}</td>`:""}<td><b>${fmtVal(k,o.data[k])}</b></td></tr>`).join("");
    if(o.col==="profiles"&&!o.before)rows+=`<tr><td>Password</td><td><b>Temporary password set</b></td></tr>`;
    if((o.data.photoId||"")!==((o.before||{}).photoId||""))rows+=`<tr><td>Photo</td>${o.before?`<td class="muted">—</td>`:""}<td><b>Updated</b></td></tr>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:6px"><div><span class="chip ${o.data==null?"bad":o.before?"info":"ok"}">${verb}</span> ${esc(opName(o))}</div>
    ${warn?`<p class="err" style="margin:0">${esc(warn)}</p>`:""}
    ${o.data==null?"":rows?`<div class="tablewrap"><table><thead><tr><th>Field</th>${o.before?"<th>Now</th>":""}<th>${o.before?"Proposed":"Value"}</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<p class="muted" style="margin:0;font-size:13.5px">No field changes.</p>`}</div>`;
}
const REQ_TONE={pending:"warn",approved:"ok",rejected:"bad",withdrawn:""};

function reqCard(r,mode){

/* ---------- CSV ---------- */
function csvCell(v){v=String(v??"");return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCSV(rows){return [CSV_COLS.join(","),...rows.map(p=>CSV_COLS.map(c=>csvCell(p[c])).join(","))].join("\r\n");}
function parseCSV(text){
  const out=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;else if(c===","){row.push(cell);cell="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);out.push(row);row=[];cell="";}
    else cell+=c;}
  if(cell||row.length){row.push(cell);out.push(row);}
  return out.filter(r=>r.some(x=>x.trim()));
}
const ALIAS={"serviceno":"serviceNo","servicenumber":"serviceNo","svcno":"serviceNo","no":"serviceNo","surname":"surname","lastname":"surname","firstname":"firstName","othernames":"otherNames","othername":"otherNames","rank":"rank","gender":"gender","sex":"gender","dob":"dob","dateofbirth":"dob","dateenlisted":"dateEnlisted","dateofenlistment":"dateEnlisted","lastpromotion":"lastPromotion","dateoflastpromotion":"lastPromotion","station":"station","unit":"unit","department":"unit","appointment":"appointment","status":"status","phone":"phone","telephone":"phone","phoneno":"phone","contact":"phone","altphone":"altPhone","email":"email","ghanacard":"ghanaCard","ghanacardno":"ghanaCard","bloodgroup":"bloodGroup","maritalstatus":"maritalStatus","hometown":"hometown","regionorigin":"regionOrigin","regionoforigin":"regionOrigin","address":"address","nokname":"nokName","nextofkin":"nokName","nokrelation":"nokRelation","nokphone":"nokPhone","nextofkinphone":"nokPhone","qualifications":"qualifications","courses":"courses","notes":"notes","remarks":"notes"};
function normDate(v){v=(v||"").trim();if(!v)return "";if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
  let m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(v);if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  const d=new Date(v);return isNaN(d)?v:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

async function handleCSV(file){

    case "delUser":{const u=S.users.find(x=>x.id===id);if(!u)return;if(!can("users")||id===S.me.id||!manageable(u))return;
      if(u.role==="admin"&&S.users.filter(x=>x.role==="admin"&&x.active!==false).length<=1){toast("Keep at least one active administrator.");return;}
      if(!t.dataset.armed){t.dataset.armed="1";t.textContent="Tap again to delete";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent=t.closest(".pane-foot")?"Delete user":"Delete";}},4000);return;}
      try{const r=await commit("Deleted user",`${u.name} (${u.username})`,[{col:"profiles",id,username:u.username,data:null,before:u}]);if(S.sheet)closeSheet();toast(r==="pending"?PENDING_MSG:"User deleted. They can no longer sign in.");}catch(err){writeFail(err);}return;}
    case "approveReq":t.disabled=true;await decideReq(id,true);return;
    case "rejectReq":t.disabled=true;await decideReq(id,false);return;
    case "withdrawReq":{const r=S.requests.find(x=>x.id===id);if(r&&r.by===S.me.id&&r.status==="pending"){try{const ops=(r.ops||[]).map(o=>{const c={...o};delete c.pw;return c;});await put("requests",id,{...r,ops,status:"withdrawn",decidedAt:new Date().toISOString()});toast("Request withdrawn");}catch(err){writeFail(err);}}return;}
    case "pruneReq":{if(!isAdmin())return;if(!t.dataset.armed){t.dataset.armed="1";t.textContent="Tap again to clear";return;}
      const cut=new Date(Date.now()-60*864e5).toISOString();const old=S.requests.filter(r=>r.status!=="pending"&&(r.decidedAt||r.createdAt)<cut);
      try{for(const r of old)await remove("requests",r.id);logAct("Cleared old requests",old.length+" requests");toast("Cleared "+old.length+" old requests");}catch(err){writeFail(err);}return;}
    case "loadAudit":return loadAudit();
    case "import":return openImport();
    case "pickCSV":return $("#csvInput").click();
    case "runImport":return runImport(t);
    case "template":return saveFile("UWR_nominal_roll_template.csv",toCSV([]));
    case "export":{const rows=filtered();logAct("Exported nominal roll",rows.length+" records");return saveFile(`UWR_nominal_roll_${todayISO()}.csv`,toCSV(rows));}
    case "copyCSV":{const ta=$("#csvText");try{await navigator.clipboard.writeText(ta.value);toast("Copied");}catch(err){ta.focus();ta.select();toast("Text selected. Press copy on your keyboard.");}return;}
    case "pickPhoto":return $("#photoInput").click();
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.sheet)closeSheet();
  if(e.key==="Enter"&&e.target.matches("tr[data-open]"))openProfile(e.target.dataset.open);
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.f.q=e.target.value;updatePeople();return;}
  const pk=e.target.dataset&&e.target.dataset.pick;
  if(pk){const form=e.target.closest("form");const h=form&&form.querySelector(`input[type=hidden][name="${pk}"]`);const list=[...form.querySelectorAll("#dl_"+e.target.id+" option")].map(o=>o.value);
    const p=resolvePerson(e.target.value,S.personnel.filter(x=>list.includes(personKey(x))));
    if(h){const old=h.value;h.value=p?p.id:"";if(old!==h.value)h.dispatchEvent(new Event("change",{bubbles:true}));}
    const hint=document.getElementById(e.target.id+"_hint");if(hint)hint.textContent=p?"Selected: "+pLabel(p):(e.target.value?"No single match yet. Keep typing or pick from the suggestions.":"Pick a name from the suggestions.");
    if(p&&e.target.id==="u_pl"){const n=$("#u_name");if(n&&!n.value)n.value=(p.rank?p.rank+" ":"")+shortName(p);}
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="auditUser")return renderAudit();
  const m={fStation:"station",fRank:"rank",fStatus:"status",fGender:"gender",fSort:"sort"}[e.target.id];
  if(m){S.f[m]=e.target.value;updatePeople();}
});
$("#attInput").addEventListener("change",e=>{const fs=[...e.target.files];e.target.value="";if(fs.length&&S.attKey&&canUpload())uploadFiles(S.attKey,fs);});
new MutationObserver(()=>{clearTimeout(S.hyT);S.hyT=setTimeout(hydrate,30);}).observe(document.body,{childList:true,subtree:true});
document.addEventListener("click",e=>{const a=e.target.closest("a[data-path]");if(a&&!a.dataset.ok){e.preventDefault();hydrate().then(()=>{if(a.dataset.ok)window.open(a.href,"_blank","noopener");});}},true);
$("#jsonInput").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f||!isAdmin())return;const prog=$("#restoreProg");
  try{const d=JSON.parse(await f.text());let n=0;
    for(const t of ["personnel","leave","transfers"]){const rows=(d[t]||[]).map(r=>({id:String(r.id),data:r.data||{}}));for(let i=0;i<rows.length;i+=200){chk(await sb.from(t).upsert(rows.slice(i,i+200)));n+=Math.min(200,rows.length-i);if(prog)prog.textContent=`Restored ${n} records…`;}}
    if(d.lists&&d.lists.ranks)await saveLists(d.lists);
    await loadAll();logAct("Restored backup",`${n} records from ${f.name}`);toast(`Restored ${n} records`);if(prog)prog.textContent=`Restored ${n} records.`;renderAll();
  }catch(x){toast("That backup file could not be read: "+(x.message||x));}
});
$("#csvInput").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)handleCSV(f);});
$("#photoInput").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f||!canUpload())return;
  if(f.size>5*1024*1024){toast("Choose a photo under 5 MB.");return;}
  const prev=$("#photoPrev");if(prev)prev.innerHTML=`<span class="av lg">…</span>`;
  try{const path=await uploadOne(f);S.formPhoto=path;if($("#photoPrev"))$("#photoPrev").innerHTML=`<span class="av lg"><img data-path="${esc(path)}" alt=""></span>`;toast("Photo added. Save the record to keep it.");}
  catch(err){toast("Photo upload failed. Try a smaller JPEG.");if($("#photoPrev"))$("#photoPrev").innerHTML=`<span class="av lg">!</span>`;}
});
/* session expiry check */
setInterval(()=>{if(!S.me)return;let at=0;try{at=+localStorage.getItem("uwr.loginAt")||0;}catch(e){}if(at&&Date.now()-at>SESSION_HOURS*3600e3)signOut("Your session ended. Sign in again.");},60000);

/* ---------- boot ---------- */
showGate();
(async()=>{
  if(CFG.url.startsWith("__")||typeof supabase==="undefined"){S.cfgMissing=true;showGate();return;}
  sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"uwr-auth"}});S.db=sb;
  const r=await sb.rpc("setup_needed");
  if(r.error){S.gateMsg="Cannot reach the database. Check your internet connection and reload the page.";showGate();return;}
  S.setupNeeded=!!r.data;
  if(!S.setupNeeded&&await resumeSession())return;
  showGate();
})();
})();

</script>
</body>
</html>
